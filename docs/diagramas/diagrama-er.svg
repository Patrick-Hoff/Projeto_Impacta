<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .tbl { fill: #ffffff; stroke: #555; stroke-width: 1.2; }
    .hdr { fill: #d9d9d9; stroke: #555; stroke-width: 1.2; }
    .name { text-anchor: middle; font-size: 12px; }
    .sep { stroke: #555; stroke-width: 1; }
    .pk { font-weight: bold; text-decoration: underline; }
    .nn { font-weight: bold; }
    .rel { stroke: #111; stroke-width: 1.4; fill: none; }
  </style>

  <!-- ===== clientes ===== -->
  <g>
    <rect class="hdr" x="30" y="40" width="230" height="24"/>
    <text class="name" x="145" y="56">CLIENTES</text>
    <rect class="tbl" x="30" y="64" width="230" height="110"/>
    <line class="sep" x1="72" y1="64" x2="72" y2="174"/>
    <text class="nn" x="38" y="81">PK</text>
    <text class="pk" x="80" y="81">ID</text>
    <line class="sep" x1="30" y1="90" x2="260" y2="90"/>
    <text class="nn" x="80" y="108">NOME</text>
    <text x="38" y="126">U1</text>
    <text class="nn" x="80" y="126">CPF</text>
    <text x="80" y="144">TELEFONE</text>
    <text x="80" y="162">EMAIL</text>
  </g>

  <!-- ===== vendas ===== -->
  <g>
    <rect class="hdr" x="335" y="40" width="230" height="24"/>
    <text class="name" x="450" y="56">VENDAS</text>
    <rect class="tbl" x="335" y="64" width="230" height="110"/>
    <line class="sep" x1="392" y1="64" x2="392" y2="174"/>
    <text class="nn" x="343" y="81">PK</text>
    <text class="pk" x="400" y="81">ID</text>
    <line class="sep" x1="335" y1="90" x2="565" y2="90"/>
    <text x="343" y="108">FK1</text>
    <text class="nn" x="400" y="108">CLIENTE_ID</text>
    <text x="343" y="126">FK2,U1</text>
    <text class="nn" x="400" y="126">VEICULO_ID</text>
    <text class="nn" x="400" y="144">VALOR</text>
    <text class="nn" x="400" y="162">DATA_VENDA</text>
  </g>

  <!-- ===== veiculos ===== -->
  <g>
    <rect class="hdr" x="640" y="40" width="230" height="24"/>
    <text class="name" x="755" y="56">VEICULOS</text>
    <rect class="tbl" x="640" y="64" width="230" height="164"/>
    <line class="sep" x1="682" y1="64" x2="682" y2="228"/>
    <text class="nn" x="648" y="81">PK</text>
    <text class="pk" x="690" y="81">ID</text>
    <line class="sep" x1="640" y1="90" x2="870" y2="90"/>
    <text class="nn" x="690" y="108">MARCA</text>
    <text class="nn" x="690" y="126">MODELO</text>
    <text class="nn" x="690" y="144">ANO</text>
    <text x="690" y="162">COR</text>
    <text class="nn" x="690" y="180">QUILOMETRAGEM</text>
    <text class="nn" x="690" y="198">PRECO</text>
    <text class="nn" x="690" y="216">STATUS</text>
  </g>

  <!-- ===== interesses ===== -->
  <g>
    <rect class="hdr" x="335" y="290" width="230" height="24"/>
    <text class="name" x="450" y="306">INTERESSES</text>
    <rect class="tbl" x="335" y="314" width="230" height="56"/>
    <line class="sep" x1="390" y1="314" x2="390" y2="370"/>
    <text class="nn" x="341" y="331">PK,FK1</text>
    <text class="pk" x="398" y="331">CLIENTE_ID</text>
    <text class="nn" x="341" y="349">PK,FK2</text>
    <text class="pk" x="398" y="349">VEICULO_ID</text>
    <line class="sep" x1="335" y1="358" x2="565" y2="358"/>
  </g>

  <!-- Relacionamentos (seta aponta para a tabela referenciada) -->
  <line class="rel" x1="335" y1="108" x2="260" y2="108" marker-end="url(#arrow)"/>
  <line class="rel" x1="565" y1="126" x2="640" y2="126" marker-end="url(#arrow)"/>
  <polyline class="rel" points="335,331 145,331 145,174" marker-end="url(#arrow)"/>
  <polyline class="rel" points="565,349 755,349 755,228" marker-end="url(#arrow)"/>

  <!-- Legenda -->
  <text x="30" y="410" font-size="11" fill="#333">Legenda: <tspan font-weight="bold">negrito</tspan> = NOT NULL · <tspan text-decoration="underline">sublinhado</tspan> = chave primária · PK = Primary Key · FK = Foreign Key · U = Unique</text>
  <text x="30" y="426" font-size="11" fill="#333">Banco: auto_dealer (MySQL) · STATUS: enum('disponivel','vendido') · Cada veículo pode ter no máximo uma venda (U1 em VENDAS.VEICULO_ID)</text>
</svg>
