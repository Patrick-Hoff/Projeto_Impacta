<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="920" height="780" fill="#ffffff"/>
  <defs>
    <radialGradient id="uc" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9d4f0"/>
    </radialGradient>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <polyline points="1,1 11,6 1,11" fill="none" stroke="#333" stroke-width="1.3"/>
    </marker>
  </defs>
  <style>
    .uc { fill: url(#uc); stroke: #3a5f8a; stroke-width: 1.2; }
    .uct { font-weight: bold; text-anchor: middle; font-size: 12px; }
    .assoc { stroke: #333; stroke-width: 1.2; }
    .dep { stroke: #333; stroke-width: 1.2; stroke-dasharray: 6,4; fill: none; }
    .stereo { font-size: 11px; text-anchor: middle; }
  </style>

  <!-- Moldura do diagrama -->
  <path d="M0.5,0.5 H170 V14 L160,24 H0.5 Z" fill="#fff" stroke="#333"/>
  <text x="6" y="17" font-weight="bold">uc Sistema Auto Dealer</text>

  <!-- Fronteira do sistema -->
  <rect x="215" y="40" width="440" height="710" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="435" y="58" text-anchor="middle">Sistema de Gestão de Loja de Veículos (Auto Dealer)</text>

  <!-- Ator -->
  <g stroke="#333" stroke-width="1.3" fill="none">
    <circle cx="95" cy="352" r="12" fill="#f5d6a8"/>
    <line x1="95" y1="364" x2="95" y2="400"/>
    <line x1="73" y1="376" x2="117" y2="376"/>
    <line x1="95" y1="400" x2="77" y2="428"/>
    <line x1="95" y1="400" x2="113" y2="428"/>
  </g>
  <text x="95" y="446" text-anchor="middle" font-weight="bold">Funcionário</text>
  <text x="95" y="461" text-anchor="middle" font-style="italic">(da loja)</text>

  <!-- Associações ator → casos de uso -->
  <g class="assoc">
    <line x1="117" y1="372" x2="276" y2="100"/>
    <line x1="117" y1="372" x2="276" y2="190"/>
    <line x1="117" y1="374" x2="276" y2="280"/>
    <line x1="117" y1="378" x2="276" y2="390"/>
    <line x1="117" y1="380" x2="276" y2="510"/>
    <line x1="117" y1="382" x2="276" y2="610"/>
    <line x1="117" y1="384" x2="276" y2="700"/>
  </g>

  <!-- Casos de uso (coluna principal) -->
  <ellipse class="uc" cx="360" cy="100" rx="85" ry="30"/>
  <text class="uct" x="360" y="104">Manter Veículos</text>

  <ellipse class="uc" cx="360" cy="190" rx="85" ry="30"/>
  <text class="uct" x="360" y="187">Pesquisar / Filtrar</text>
  <text class="uct" x="360" y="201">Veículos</text>

  <ellipse class="uc" cx="360" cy="280" rx="85" ry="30"/>
  <text class="uct" x="360" y="284">Manter Clientes</text>

  <ellipse class="uc" cx="360" cy="390" rx="85" ry="30"/>
  <text class="uct" x="360" y="394">Registrar Venda</text>

  <ellipse class="uc" cx="360" cy="510" rx="85" ry="30"/>
  <text class="uct" x="360" y="507">Editar / Excluir</text>
  <text class="uct" x="360" y="521">Venda</text>

  <ellipse class="uc" cx="360" cy="610" rx="85" ry="30"/>
  <text class="uct" x="360" y="607">Consultar Histórico</text>
  <text class="uct" x="360" y="621">de Vendas</text>

  <ellipse class="uc" cx="360" cy="700" rx="85" ry="30"/>
  <text class="uct" x="360" y="704">Visualizar Dashboard</text>

  <!-- Casos de uso (coluna secundária) -->
  <ellipse class="uc" cx="555" cy="230" rx="88" ry="30"/>
  <text class="uct" x="555" y="227">Registrar Interesse</text>
  <text class="uct" x="555" y="241">em Veículo</text>

  <ellipse class="uc" cx="555" cy="340" rx="88" ry="30"/>
  <text class="uct" x="555" y="344">Buscar Cliente</text>

  <ellipse class="uc" cx="555" cy="460" rx="88" ry="30"/>
  <text class="uct" x="555" y="457">Atualizar Status</text>
  <text class="uct" x="555" y="471">do Veículo</text>

  <!-- «extend»: Registrar Interesse → Manter Clientes -->
  <line class="dep" x1="476" y1="245" x2="440" y2="263" marker-end="url(#open)"/>
  <text class="stereo" x="478" y="268">«extend»</text>

  <!-- «include»: Registrar Venda → Buscar Cliente -->
  <line class="dep" x1="428" y1="372" x2="476" y2="356" marker-end="url(#open)"/>
  <text class="stereo" x="428" y="350">«include»</text>

  <!-- «include»: Registrar Venda → Atualizar Status -->
  <line class="dep" x1="420" y1="411" x2="485" y2="438" marker-end="url(#open)"/>
  <text class="stereo" x="440" y="440">«include»</text>

  <!-- «include»: Editar/Excluir Venda → Atualizar Status -->
  <line class="dep" x1="423" y1="490" x2="484" y2="477" marker-end="url(#open)"/>
  <text class="stereo" x="484" y="504">«include»</text>

  <!-- Nota -->
  <g>
    <path d="M685,60 H885 V250 H685 Z" fill="#fffbd6" stroke="#8a8a5a"/>
    <circle cx="785" cy="60" r="9" fill="#fff" stroke="#888"/>
    <text font-size="11" fill="#222">
      <tspan x="695" y="88">Casos de uso do sistema de</tspan>
      <tspan x="695" y="103">gestão interna da loja de</tspan>
      <tspan x="695" y="118">veículos usados.</tspan>
      <tspan x="695" y="140">"Manter" = cadastrar, listar,</tspan>
      <tspan x="695" y="155">editar e excluir.</tspan>
      <tspan x="695" y="177">Ao registrar ou excluir uma</tspan>
      <tspan x="695" y="192">venda, o status do veículo</tspan>
      <tspan x="695" y="207">muda automaticamente</tspan>
      <tspan x="695" y="222">(disponível ↔ vendido).</tspan>
    </text>
  </g>
</svg>
